[build-system]
build-backend = "setuptools.build_meta"
requires = [ "setuptools>=77.0.3" ]

[project]
name = "packaging-34j"
version = "1.1.1"
description = "Packaging tools and configuration for 34j Python projects."
readme = "README.md"
license = "MIT"
authors = [ { name = "34j" } ]
requires-python = ">=3.12"
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries",
]
optional-dependencies.docs = [
  "furo>=2025.12.19",
  "myst-parser>=5.1",
  "sphinx>=9.1.1",
  "sphinx-autobuild>=2025.8.25",
  "sphinx-math-dollar>=1.3",
]
optional-dependencies.test = [
  "pytest>=9",
  "pytest-cov>=7",
  "sybil[pytest]>=10.1",
]
urls."Bug Tracker" = "https://github.com/34j/packaging-34j/issues"
urls.Changelog = "https://github.com/34j/packaging-34j/blob/main/CHANGELOG.md"
urls.documentation = "https://packaging-34j.readthedocs.io"
urls.repository = "https://github.com/34j/packaging-34j"
entry-points.pytest11.packaging_34j = "packaging_34j.pytest_plugin"

[dependency-groups]
dev = [ "ty" ]

[tool.setuptools]
package-data.packaging_34j = [
  "coverage.ini",
  "ruff.toml",
  "semantic_release.toml",
]

[tool.ruff]
extend = ".venv/../src/packaging_34j/ruff.toml"

[tool.pyproject-fmt]
max_supported_python = "3.14"

[tool.ty]
terminal.error-on-warning = true
